<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蓮花（挺水植物）與水位 AR 實驗</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    font-family: "Microsoft JhengHei", sans-serif;
  }
  [hidden] { display: none !important; }
  .panel {
    position: fixed; z-index: 10; left: 10px; right: 10px;
    max-width: 480px; margin: auto;
    background: rgba(255, 255, 255, 0.95);
    padding: 14px; border-radius: 16px;
    box-shadow: 0 4px 22px #0002;
  }
  #top { top: max(10px, env(safe-area-inset-top)); }
  #bottom { bottom: max(10px, env(safe-area-inset-bottom)); }
  h1 { font-size: 19px; color: #155744; margin: 0 0 7px; }
  p { font-size: 14px; line-height: 1.6; margin: 6px 0; }
  button {
    background: #176b57; color: white; border: 0;
    border-radius: 9px; padding: 11px 13px;
    font: inherit; touch-action: manipulation;
  }
  button:disabled { background: #888; }
  #start { margin-top: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { font-weight: bold; color: #155744; }
  input[type="range"] {
    width: 100%; height: 38px;
    accent-color: #176b57; touch-action: pan-x;
  }
  .note { font-size: 12px; color: #666; }
  .row button { flex: 1; }
  #result { min-height: 42px; }
  #levelValue { font-weight: bold; }
  #status { overflow-wrap: anywhere; }
</style>

<script>
// 自動調整 Lotus.glb 大小並將根部固定在水槽底泥上
AFRAME.registerComponent('fit-lotus', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      try {
        const mesh = this.el.getObject3D('mesh');
        const THREE = AFRAME.THREE;

        // 計算模型原始尺寸並縮放至適合水槽的大小
        const box = new THREE.Box3().setFromObject(mesh);
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const scale = 1.05 / maxDim;
        mesh.scale.setScalar(scale);

        // 重新計算縮放後的邊界，將水平置中、底部貼齊底泥表面 (y = 0.12)
        const scaledBox = new THREE.Box3().setFromObject(mesh);
        const center = scaledBox.getCenter(new THREE.Vector3());
        mesh.position.x -= center.x;
        mesh.position.z -= center.z;
        mesh.position.y = 0.11 - scaledBox.min.y;

        // 通知外層水槽模型已準備完成
        this.el.parentEl.emit('lotus-ready', {}, false);
      } catch (err) {
        console.error(err);
        this.el.parentEl.emit('tank-error', { message: '蓮花模型處理失敗：' + err.message }, false);
      }
    });

    this.el.addEventListener('model-error', () => {
      this.el.parentEl.emit('tank-error', {
        message: '蓮花模型載入失敗，請確認 Lotus.glb 已上傳至同一資料夾。'
      }, false);
    });
  }
});

// 控制程式生成的透明水槽與動態水位升降
AFRAME.registerComponent('tank-interaction', {
  init: function () {
    this.ready = false;
    this.base = 0.12;      // 底泥高度
    this.minDepth = 0.18;  // 最低水深
    this.maxDepth = 0.62;  // 最高水深
    this.depth = 0.40;
    this.targetDepth = 0.40;

    this.body = this.el.querySelector('#water-body');
    this.surface = this.el.querySelector('#water-surface');

    // 設定透明玻璃與水體的雙面渲染順序，避免破圖
    this.el.addEventListener('loaded', () => {
      const glassObj = this.el.querySelector('#tank-glass')?.getObject3D('mesh');
      if (glassObj && glassObj.material) {
        glassObj.material.depthWrite = false;
        glassObj.material.side = AFRAME.THREE.DoubleSide;
        glassObj.renderOrder = 3;
      }
      const waterObj = this.body?.getObject3D('mesh');
      if (waterObj && waterObj.material) {
        waterObj.material.depthWrite = false;
        waterObj.material.side = AFRAME.THREE.DoubleSide;
        waterObj.renderOrder = 2;
      }
    });

    this.el.addEventListener('lotus-ready', () => {
      this.ready = true;
      this.setLevel(50);
      this.depth = this.targetDepth;
      this.applyDepth();
      this.el.dataset.tankReady = 'true';
      this.el.emit('tank-ready', {}, false);
    });
  },

  setLevel: function (percent) {
    if (!this.ready) return;
    const p = Math.min(100, Math.max(0, Number(percent))) / 100;
    this.targetDepth = this.minDepth + (this.maxDepth - this.minDepth) * p;
  },

  applyDepth: function () {
    if (!this.body || !this.surface) return;
    // 改變水體高度並保持底部緊貼底泥
    this.body.setAttribute('height', this.depth);
    this.body.setAttribute('position', `0 ${this.base + this.depth / 2} 0`);
    // 水面位於水體最上方
    this.surface.setAttribute('position', `0 ${this.base + this.depth} 0`);
  },

  tick: function (time, delta) {
    if (!this.ready) return;
    const alpha = 1 - Math.exp(-Math.min(delta || 16, 100) / 140);
    this.depth += (this.targetDepth - this.depth) * alpha;
    this.applyDepth();
  }
});
</script>
</head>

<body>

<div id="top" class="panel">
  <h1>蓮花（挺水植物）與水位 AR 實驗</h1>
  <p id="status" role="status" aria-live="polite">正在載入立體水槽與蓮花模型……</p>
  <button id="start" disabled>載入中</button>
  <p class="note">蓮花模型與水槽為教學示意；水位升降為互動模擬。</p>
</div>

<div id="bottom" class="panel" hidden>
  <div class="row">
    <label for="level">調整水位</label>
    <span id="levelValue">50%</span>
  </div>

  <input id="level" type="range" min="0" max="100" value="50" step="1" aria-label="水位百分比">

  <div class="row">
    <button data-level="0">低水位</button>
    <button data-level="50">中水位</button>
    <button data-level="100">高水位</button>
  </div>

  <p id="result">試著調整水位，觀察蓮花（挺水植物）與水面的相對位置。</p>

  <div class="row">
    <button id="rotate">旋轉</button>
    <button id="view">換角度</button>
    <button id="reset">重設</button>
  </div>

  <p class="note">觀察：蓮花的根固定在槽底泥土，葉片與花朵是否挺出水面？</p>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  loading-screen="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  <a-entity light="type: directional; intensity: 1.3" position="1 2 3"></a-entity>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity id="spin" position="0 -0.1 0.02">
      <a-entity id="tilt" rotation="70 0 0">
        <!-- 水槽與蓮花總容器 -->
        <a-entity id="tank" scale="0.55 0.55 0.55" tank-interaction>
          
          <!-- 1. 透明玻璃水槽外框 -->
          <a-box id="tank-glass" width="1.1" height="1.25" depth="1.1" position="0 0.625 0"
                 material="color: #d9f2ff; transparent: true; opacity: 0.14; roughness: 0.1"></a-box>
          
          <!-- 2. 底部底泥層 -->
          <a-box id="tank-soil" width="1.08" height="0.12" depth="1.08" position="0 0.06 0"
                 material="color: #5c4033; roughness: 0.9"></a-box>

          <!-- 3. 動態半透明水體 -->
          <a-box id="water-body" width="1.08" height="0.40" depth="1.08" position="0 0.32 0"
                 material="color: #29b6f6; transparent: true; opacity: 0.25; roughness: 0.1"></a-box>

          <!-- 4. 水面薄膜（凸顯水位線） -->
          <a-plane id="water-surface" width="1.08" height="1.08" rotation="-90 0 0" position="0 0.52 0"
                   material="color: #81d4fa; transparent: true; opacity: 0.45; side: double"></a-plane>

          <!-- 5. 你的蓮花 3D 模型 -->
          <a-entity id="lotus-model" gltf-model="url(./Lotus.glb)" fit-lotus></a-entity>

        </a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
const scene = document.querySelector('a-scene');
const tank = document.querySelector('#tank');

const status = document.querySelector('#status');
const start = document.querySelector('#start');
const bottom = document.querySelector('#bottom');

const level = document.querySelector('#level');
const value = document.querySelector('#levelValue');
const result = document.querySelector('#result');

let sceneReady = Boolean(scene.hasLoaded);
let modelReady = false;
let failed = false;
let starting = false;
let running = false;
let angle = 0;
let viewIndex = 0;
const views = [70, 90, 40];

function ready() {
  if (failed || running || starting) return;
  if (sceneReady && modelReady) {
    start.disabled = false;
    start.textContent = '啟動 AR 鏡頭';
    status.textContent = '水槽與蓮花已載入。啟動鏡頭後，請掃描指定圖卡。';
  }
}

function fail(message) {
  failed = true;
  running = false;
  starting = false;
  status.textContent = message;
  start.hidden = false;
  start.disabled = true;
  start.textContent = '請修正後重新整理';
  bottom.hidden = true;
  try { scene.systems['mindar-image-system']?.stop(); } catch (error) { console.warn(error); }
}

scene.addEventListener('loaded', () => { sceneReady = true; ready(); });
tank.addEventListener('tank-ready', () => { modelReady = true; ready(); });
tank.addEventListener('tank-error', event => { fail(event.detail.message); });

if (tank.dataset.tankReady === 'true') modelReady = true;
if (tank.dataset.tankError) fail(tank.dataset.tankError);
ready();

scene.addEventListener('arReady', () => {
  if (failed) return;
  starting = false;
  running = true;
  start.hidden = true;
  bottom.hidden = false;
  status.textContent = '請對準完整圖卡，辨識後拖動水位滑桿。';
});

scene.addEventListener('arError', () => {
  fail('無法啟動鏡頭，請確認相機權限，以及 targets.mind 是否存在。');
});

start.addEventListener('click', async () => {
  if (failed || starting || running || !modelReady || !sceneReady) return;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    status.textContent = '請使用手機瀏覽器開啟 HTTPS 網址，並允許相機權限。';
    return;
  }
  starting = true;
  start.disabled = true;
  start.textContent = '啟動中';
  status.textContent = '請允許網站使用相機……';
  try {
    await scene.systems['mindar-image-system'].start();
  } catch (error) {
    console.error(error);
    fail('AR 啟動失敗：請允許相機權限，並確認 targets.mind 已上傳。');
  }
});

document.querySelector('#target').addEventListener('targetFound', () => {
  if (!failed) {
    status.textContent = '辨識成功！改變水位，觀察蓮花挺出水面的構造。';
  }
});

document.querySelector('#target').addEventListener('targetLost', () => {
  if (running) {
    status.textContent = '圖卡離開鏡頭，請重新對準圖卡。';
  }
});

function setLevel(percent) {
  const p = Math.max(0, Math.min(100, Number(percent)));
  level.value = p;
  value.textContent = p + '%';
  tank.components['tank-interaction']?.setLevel(p);

  if (p < 34) {
    result.textContent = '低水位：水深變淺，蓮花根部固定於槽底，莖葉依然挺出水面。';
  } else if (p > 66) {
    result.textContent = '高水位：水深變深，部分花梗浸入水中，但花朵與主要葉片仍挺出水面。';
  } else {
    result.textContent = '中水位：蓮花根部固定在槽底泥土，葉片與花朵挺出水面生長。';
  }
}

level.addEventListener('input', event => setLevel(event.target.value));
document.querySelectorAll('[data-level]').forEach(button => {
  button.addEventListener('click', () => setLevel(button.dataset.level));
});

document.querySelector('#rotate').addEventListener('click', () => {
  angle = (angle + 30) % 360;
  document.querySelector('#spin').setAttribute('rotation', `0 0 ${angle}`);
});

document.querySelector('#view').addEventListener('click', () => {
  viewIndex = (viewIndex + 1) % views.length;
  document.querySelector('#tilt').setAttribute('rotation', `${views[viewIndex]} 0 0`);
});

document.querySelector('#reset').addEventListener('click', () => {
  angle = 0;
  viewIndex = 0;
  setLevel(50);
  document.querySelector('#spin').setAttribute('rotation', '0 0 0');
  document.querySelector('#tilt').setAttribute('rotation', '70 0 0');
});

window.addEventListener('pagehide', () => {
  try { scene.systems['mindar-image-system']?.stop(); } catch (error) { console.warn(error); }
});
</script>
</body>
</html>
